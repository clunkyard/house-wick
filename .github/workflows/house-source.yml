name: Refresh published House source
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: house-source
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'clunkyard/house-wick'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify and refresh public source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          updater_ref="$(gh api 'repos/clunkyard/.github/commits/main' --jq '.sha')"
          if [[ ! "$updater_ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'GitHub did not return a valid central House updater commit.' >&2
            exit 1
          fi
          printf 'House updater: https://github.com/clunkyard/.github/commit/%s (main)\n' "$updater_ref" | tee -a "$GITHUB_STEP_SUMMARY"
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 "https://raw.githubusercontent.com/clunkyard/.github/$updater_ref/scripts/sync-house.cjs" -o "$RUNNER_TEMP/sync-house.cjs"
          node "$RUNNER_TEMP/sync-house.cjs" --sync 2a5bd947-f1e8-4ed3-914c-53309cfca618 --slug wick
      - name: Commit verified changes
        run: |
          git add --all
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'clunkyard-house[bot]'
          git config user.email 'house@users.noreply.github.com'
          git commit -m 'Refresh published House robot source'
          git push
