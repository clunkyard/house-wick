name: Refresh published House source
on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: house-source
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'clunkyard/house-wick'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify and refresh public source
        run: |
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 'https://raw.githubusercontent.com/clunkyard/.github/2813bfba156465fffff9854b749809dc5bbfa5da/scripts/sync-house.cjs' -o "$RUNNER_TEMP/sync-house.cjs"
          printf '%s  %s\n' '0d25e35c295bcdbca5d6ccdab349aa611428b3dca0bb19da75c1cf164e9e10da' "$RUNNER_TEMP/sync-house.cjs" | sha256sum --check
          node "$RUNNER_TEMP/sync-house.cjs" --sync 2a5bd947-f1e8-4ed3-914c-53309cfca618 --slug wick
      - name: Commit verified changes
        run: |
          git add --all
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'clunkyard-house[bot]'
          git config user.email 'house@users.noreply.github.com'
          git commit -m 'Refresh published House robot source'
          git push
